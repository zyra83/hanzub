---
- name: Installer les outils de développement Kubernetes
  hosts: all
  become: true
  gather_facts: true

  vars:
    kubernetes_minor_version: "v1.34"
    k9s_version: "v0.50.9"
    minikube_version: "v1.37.0"
    kubernetes_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    helm_keyring: /etc/apt/keyrings/helm.gpg
    ohmyzsh_version: "964ddf789b022b6958b27d02d7fa54f552de21e9"
    powerlevel10k_version: "v1.20.0"
    meslolgs_fonts_version: "145eb9fbc2f42ee408dacd9b22d8e6e0e553f83d"
    binary_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"

  pre_tasks:
    - name: Vérifier que le système utilise APT
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: "Ce playbook cible Ubuntu/Debian."

    - name: Vérifier l'architecture supportée
      tags: [always]
      ansible.builtin.assert:
        that:
          - binary_architecture in ['amd64', 'arm64']
        fail_msg: "Architecture non supportée : {{ ansible_architecture }}."

  # Une liste de tâches par spec de doc/specs/, dans l'ordre des numéros.
  # Tag `minimal` : installation minimale (--tags minimal) ; sans tag, installation complète.
  tasks:
    - name: Socle commun
      ansible.builtin.import_tasks: tasks/00-prerequis.yml
      tags: [minimal]

    - name: Outils Kubernetes
      ansible.builtin.import_tasks: tasks/01-outils-kubernetes.yml

    - name: Bureautique
      ansible.builtin.import_tasks: tasks/02-bureautique.yml
      tags: [minimal]

    - name: Outils du quotidien
      ansible.builtin.import_tasks: tasks/03-outils-quotidiens.yml

    - name: Docker et runtime NVIDIA
      ansible.builtin.import_tasks: tasks/05-docker.yml

    - name: Secrets git (gnome-keyring)
      ansible.builtin.import_tasks: tasks/06-secrets-git.yml
      tags: [minimal]

    - name: Pare-feu
      ansible.builtin.import_tasks: tasks/07-pare-feu.yml
      tags: [minimal]

    - name: zsh, Oh My Zsh et Powerlevel10k
      ansible.builtin.import_tasks: tasks/08-zsh.yml
      tags: [minimal]

