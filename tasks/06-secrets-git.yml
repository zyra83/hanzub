---
# Spec : doc/specs/06-secrets-git.md
- name: Installer les dépendances du helper git pour gnome-keyring
  ansible.builtin.apt:
    name:
      - build-essential # compilateur et make
      - pkg-config # détection des bibliothèques à la compilation
      - libsecret-1-0 # bibliothèque Secret Service (exécution)
      - libsecret-1-dev # en-têtes libsecret (compilation)
      - libglib2.0-dev # en-têtes GLib (compilation)
      - libsecret-tools # commande `secret` pour interroger le trousseau
      - gnome-keyring # trousseau de secrets GNOME
    state: present
    update_cache: true

- name: Vérifier la présence du helper git-credential-libsecret
  ansible.builtin.stat:
    path: /usr/local/bin/git-credential-libsecret
  register: secrets_git_binaire

- name: Compiler et installer git-credential-libsecret
  when: not secrets_git_binaire.stat.exists
  block:
    - name: Créer un répertoire de compilation temporaire
      ansible.builtin.tempfile:
        state: directory
        prefix: git-credential-libsecret.
      register: secrets_git_build

    - name: Copier les sources du helper depuis la doc de git
      ansible.builtin.copy:
        src: /usr/share/doc/git/contrib/credential/libsecret/
        dest: "{{ secrets_git_build.path }}/"
        remote_src: true
        mode: preserve

    - name: Compiler git-credential-libsecret
      ansible.builtin.command:
        cmd: make
        chdir: "{{ secrets_git_build.path }}"
      changed_when: true

    - name: Installer git-credential-libsecret dans /usr/local/bin
      ansible.builtin.copy:
        src: "{{ secrets_git_build.path }}/git-credential-libsecret"
        dest: /usr/local/bin/git-credential-libsecret
        remote_src: true
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Supprimer le répertoire de compilation temporaire
      ansible.builtin.file:
        path: "{{ secrets_git_build.path }}"
        state: absent
      when: secrets_git_build.path is defined

- name: Lire le credential.helper système de git
  ansible.builtin.command: git config --system --get credential.helper
  register: secrets_git_helper
  changed_when: false
  failed_when: secrets_git_helper.rc not in [0, 1]

- name: Configurer git pour utiliser gnome-keyring (credential.helper système)
  ansible.builtin.command: git config --system credential.helper /usr/local/bin/git-credential-libsecret
  when: secrets_git_helper.stdout != '/usr/local/bin/git-credential-libsecret'
  changed_when: true
