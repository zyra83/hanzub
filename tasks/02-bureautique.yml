---
# Spec : doc/specs/02-bureautique.md
- name: Installer la clé du PPA Mozilla Team
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: "0644"

- name: For Debian Trixie/Ubuntu Resolute and Newer Installé le dépot mozilla
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/mozilla.sources
    content: |
      Types: deb
      URIs: https://packages.mozilla.org/apt
      Suites: mozilla
      Components: main
      Signed-By: /etc/apt/keyrings/packages.mozilla.org.asc
    owner: root
    group: root
    mode: "0644"

- name: Donner la priorité au PPA Mozilla sur les paquets de transition snap d'Ubuntu
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: firefox
      Pin: release o=Ubuntu
      Pin-Priority: -1
    owner: root
    group: root
    mode: "0644"

- name: Autoriser les mises à jour automatiques depuis le PPA Mozilla
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-mozilla
    content: |
      Unattended-Upgrade::Origins-Pattern {
              "site=packages.mozilla.org";
      };
    owner: root
    group: root
    mode: "0644"

- name: Lire la politique APT de Firefox et Thunderbird
  ansible.builtin.command: apt-cache policy firefox thunderbird
  register: bureautique_apt_policy
  changed_when: false


- name: Vérifier la présence de snapd
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: bureautique_snapd

- name: Détecter les snaps Firefox et Thunderbird
  ansible.builtin.command: "snap list {{ item }}"
  loop:
    - firefox
    - thunderbird
  register: bureautique_snaps
  changed_when: false
  failed_when: false
  when: bureautique_snapd.stat.exists

- name: Désinstaller les snaps Firefox et Thunderbird
  ansible.builtin.command: "snap remove --purge {{ item.item }}"
  loop: "{{ bureautique_snaps.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - bureautique_snapd.stat.exists
    - item.rc is defined
    - item.rc == 0
  changed_when: true

- name: Installer la suite bureautique, les navigateurs et le client mail
  ansible.builtin.apt:
    name:
      - libreoffice
      - libreoffice-l10n-fr
      - libreoffice-help-fr
      - firefox
      - firefox-locale-fr
      - thunderbird
      - thunderbird-locale-fr
      - keepassxc
      - p7zip-full # 7-Zip complet (`7z`)
    state: latest
    allow_downgrade: true
    update_cache: true
