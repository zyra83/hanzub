---
# Spec : doc/specs/02-bureautique.md
- name: Détecter un environnement graphique
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/share/wayland-sessions
    - /usr/share/xsessions
  register: bureautique_sessions

- name: Déterminer si la machine est un poste avec bureau
  ansible.builtin.set_fact:
    bureautique_est_desktop: "{{ bureautique_sessions.results | map(attribute='stat.exists') | select | list | length > 0 }}"

- name: Ignorer la bureautique sur un système sans bureau
  ansible.builtin.debug:
    msg: "Aucun environnement graphique détecté : spec 02-bureautique ignorée."
  when: not bureautique_est_desktop

- name: Installer la bureautique et les navigateurs
  when: bureautique_est_desktop
  block:
    - name: Vérifier que le système est Ubuntu (PPA Mozilla)
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: "Le PPA mozillateam ne s'applique qu'à Ubuntu."

    - name: Installer les outils de gestion des dépôts PPA
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: true

    - name: Ajouter le PPA Mozilla Team
      ansible.builtin.apt_repository:
        repo: ppa:mozillateam/ppa
        state: present
        update_cache: true

    - name: Donner la priorité au PPA Mozilla sur les paquets de transition snap d'Ubuntu
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/mozilla-ppa
        content: |
          Package: firefox* thunderbird*
          Pin: release o=LP-PPA-mozillateam
          Pin-Priority: 1001
        owner: root
        group: root
        mode: "0644"

    - name: Autoriser les mises à jour automatiques depuis le PPA Mozilla
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51unattended-upgrades-mozilla
        content: |
          Unattended-Upgrade::Allowed-Origins:: "LP-PPA-mozillateam:${distro_codename}";
        owner: root
        group: root
        mode: "0644"

    - name: Lire la politique APT de Firefox et Thunderbird
      ansible.builtin.command: apt-cache policy firefox thunderbird
      register: bureautique_apt_policy
      changed_when: false

    - name: Vérifier que le PPA Mozilla fournit bien les paquets (sinon on ne touche pas aux snaps)
      ansible.builtin.assert:
        that:
          - "'mozillateam' in bureautique_apt_policy.stdout"
        fail_msg: "PPA mozillateam indisponible ou sans firefox/thunderbird pour cette version d'Ubuntu : les snaps sont conservés."

    - name: Vérifier la présence de snapd
      ansible.builtin.stat:
        path: /usr/bin/snap
      register: bureautique_snapd

    - name: Détecter les snaps Firefox et Thunderbird
      ansible.builtin.command: "snap list {{ item }}"
      loop:
        - firefox
        - thunderbird
      register: bureautique_snaps
      changed_when: false
      failed_when: false
      when: bureautique_snapd.stat.exists

    - name: Désinstaller les snaps Firefox et Thunderbird
      ansible.builtin.command: "snap remove --purge {{ item.item }}"
      loop: "{{ bureautique_snaps.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when:
        - bureautique_snapd.stat.exists
        - item.rc is defined
        - item.rc == 0
      changed_when: true

    - name: Installer la suite bureautique, les navigateurs et le client mail
      ansible.builtin.apt:
        name:
          - libreoffice
          - libreoffice-l10n-fr
          - libreoffice-help-fr
          - firefox
          - firefox-locale-fr
          - thunderbird
          - thunderbird-locale-fr
          - keepassxc
          - p7zip-full # 7-Zip complet (`7z`)
        state: latest
        allow_downgrade: true
        update_cache: true
